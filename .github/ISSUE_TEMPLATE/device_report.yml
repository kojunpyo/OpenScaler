name: 게임, 기기 측정 결과 제보
description: 다른 게임이나 다른 컴퓨터(특히 고주사율 모니터)에서 써 본 결과와 측정 기록
labels: ["measurement"]
body:
  - type: markdown
    attributes:
      value: |
        README의 성능 평가는 GTX 1060 노트북 한 대에서 잰 값이라, 다른 기기와 게임의 결과가 큰 도움이 됩니다.
        체감만 적어 주셔도 좋고, 기록까지 모아 주시면 README 6.2 "어떻게 쟀나"의 기준으로 등급을 매길 수 있습니다.
  - type: input
    id: game
    attributes:
      label: 게임과 게임 창 크기, 게임 fps
      placeholder: 예) Stardew Valley, 1280x720, 60fps
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: 컴퓨터 환경
      description: Windows 버전, CPU, 그래픽카드, 모니터 주사율과 배율, OpenScaler 버전
      placeholder: |
        Windows 11 24H2, Ryzen 5 5600, RTX 3060
        2560x1440 144Hz 100% (주 모니터)
        OpenScaler v1.5.4
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 써 본 결과
      description: 프레임 생성 방식별로 부드러웠는지, 깨지는 곳이 있었는지, 지연이 느껴졌는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: records
    attributes:
      label: 측정 기록 (선택)
      description: |
        저장소의 `tools/test/devicecheck.ps1 -Target "게임 창 제목 일부"`를 실행하면 기기 정보와 방식별 기록을 한 폴더에 모읍니다.
        폴더를 zip으로 묶어 끌어다 놓거나, `python -I tools/test/fgtiming.py 결과폴더/fg_block.csv`의 출력을 붙여 주세요.
      render: text
