# 푸시와 PR마다 Windows에서 빌드해 빌드가 깨지지 않았는지 확인한다.
# v로 시작하는 태그(예: v0.1.0)를 푸시하면 빌드 결과를 zip으로 묶어 GitHub Releases에 올린다.
# zip에는 RIFE 엔진에 필요한 rife 폴더(ONNX Runtime, DirectML, 변환한 모델)도 넣어, 받기만 하면 RIFE를 쓸 수 있게 한다.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # cl, fxc, Windows SDK 경로를 설정한다 (x64 Native Tools Command Prompt와 같은 환경).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # rife 폴더는 버전과 변환 스크립트가 같으면 다시 만들지 않는다.
      - name: Cache RIFE
        id: rife-cache
        uses: actions/cache@v4
        with:
          path: rife
          key: rife-ort1.24.4-dml1.15.4-v4.26-${{ hashFiles('tools/rife_export.py') }}

      - uses: actions/setup-python@v5
        if: steps.rife-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.14"

      # NuGet에서 ONNX Runtime(MIT)과 DirectML(앱과 함께 배포 허용)을 받고,
      # Hugging Face의 RIFE v4.26 학습 모델(MIT)을 tools/rife_export.py로 ONNX로 바꾼다.
      - name: Prepare RIFE
        if: steps.rife-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force rife, tmp | Out-Null
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/1.24.4 -OutFile tmp/ort.zip
          Expand-Archive tmp/ort.zip tmp/ort
          Copy-Item tmp/ort/runtimes/win-x64/native/onnxruntime.dll, tmp/ort/runtimes/win-x64/native/onnxruntime_providers_shared.dll rife/
          Copy-Item tmp/ort/LICENSE rife/LICENSE-ONNXRuntime.txt
          Copy-Item tmp/ort/ThirdPartyNotices.txt rife/ThirdPartyNotices-ONNXRuntime.txt
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4 -OutFile tmp/dml.zip
          Expand-Archive tmp/dml.zip tmp/dml
          Copy-Item tmp/dml/bin/x64-win/DirectML.dll rife/
          Copy-Item tmp/dml/LICENSE.txt rife/LICENSE-DirectML.txt
          Copy-Item tmp/dml/ThirdPartyNotices.txt rife/ThirdPartyNotices-DirectML.txt
          Invoke-WebRequest https://huggingface.co/hzwer/RIFE/resolve/main/RIFEv4.26_0921.zip -OutFile tmp/model.zip
          Expand-Archive tmp/model.zip tmp/model
          $pkl = Get-ChildItem tmp/model -Recurse -Filter flownet.pkl | Where-Object { $_.FullName -notmatch "__MACOSX" } | Select-Object -First 1
          if (-not $pkl) { throw "flownet.pkl을 찾지 못했습니다" }
          python -m pip install --quiet torch==2.15.0 onnx==1.23.2 onnxscript==0.7.2 onnxruntime
          python -I tools/rife_export.py $pkl.FullName rife/rife.onnx
          if ($LASTEXITCODE -ne 0) { throw "모델 변환 실패" }
          Invoke-WebRequest https://raw.githubusercontent.com/hzwer/Practical-RIFE/main/LICENSE -OutFile rife/LICENSE-RIFE.txt
          Get-ChildItem rife | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/OpenScaler | Out-Null
          Copy-Item build/OpenScaler.exe, README.md, LICENSE dist/OpenScaler/
          Copy-Item rife dist/OpenScaler/rife -Recurse
          New-Item -ItemType Directory dist/OpenScaler/tools | Out-Null
          Copy-Item tools/test/devicecheck.ps1 dist/OpenScaler/tools/
          Copy-Item third_party/fsr/license.txt dist/OpenScaler/LICENSE-AMD-FSR.txt
          Copy-Item third_party/imgui/LICENSE.txt dist/OpenScaler/LICENSE-ImGui.txt
          Copy-Item third_party/galmuri/OFL.md dist/OpenScaler/LICENSE-Galmuri-OFL.md
          Compress-Archive -Path dist/OpenScaler -DestinationPath dist/OpenScaler-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenScaler-windows-x64
          path: dist/OpenScaler-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenScaler-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: OpenScaler-windows-x64.zip
          generate_release_notes: true
