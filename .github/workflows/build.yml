# 푸시와 PR마다 Windows에서 빌드해 빌드가 깨지지 않았는지 확인한다.
# v로 시작하는 태그(예: v0.1.0)를 푸시하면 빌드 결과를 zip으로 묶어 GitHub Releases에 올린다.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # cl, fxc, Windows SDK 경로를 설정한다 (x64 Native Tools Command Prompt와 같은 환경).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/OpenScaler | Out-Null
          Copy-Item build/OpenScaler.exe, README.md, LICENSE dist/OpenScaler/
          Copy-Item third_party/fsr/license.txt dist/OpenScaler/LICENSE-AMD-FSR.txt
          Copy-Item third_party/imgui/LICENSE.txt dist/OpenScaler/LICENSE-ImGui.txt
          Copy-Item third_party/galmuri/OFL.md dist/OpenScaler/LICENSE-Galmuri-OFL.md
          Compress-Archive -Path dist/OpenScaler -DestinationPath dist/OpenScaler-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenScaler-windows-x64
          path: dist/OpenScaler-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenScaler-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: OpenScaler-windows-x64.zip
          generate_release_notes: true
